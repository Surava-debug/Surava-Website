name: Update German site

# Runs whenever the English site changes, so /de/ never falls behind.
# Layout, links and numbers carry over by themselves. New wording stays in
# English on the German page and this run fails with a list of what needs
# translating, so GitHub sends a notification.
on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "js/**"
      - "_i18n/**"
      - "assets/charts/**"
      - "scripts/build-de.py"
      - "!de/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-german:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the German pages
        run: python3 scripts/build-de.py

      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "Update German site"
          git pull --rebase
          git push

      - name: Check for text that still needs German
        run: python3 scripts/build-de.py --check
